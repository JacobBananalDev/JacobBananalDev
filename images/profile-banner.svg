    <path d="M-50 248C170 58 288 287 505 126S862 60 1250 222" stroke="url(#ribbon)" stroke-width="54" opacity=".42" filter="url(#soft-glow)"/>
    <path d="M-40 232C190 62 302 276 518 127S878 71 1240 211" stroke="url(#ribbon)" stroke-width="3"/>
    <path d="M-30 275C173 132 318 303 555 158S907 105 1235 251" stroke="#38bdf8" stroke-opacity=".42" stroke-width="1.5"/>
    <path d="M-35 177C176 293 329 43 555 178S933 268 1235 112" stroke="#a78bfa" stroke-opacity=".4" stroke-width="1.5"/>
    <path d="M80 0L355 320M1120 0L845 320" stroke="#c4b5fd" stroke-opacity=".08" stroke-width="1"/>
  </g>
  <g fill="#e9d5ff">
    <circle cx="142" cy="88" r="2"/><circle cx="250" cy="240" r="1.5"/>
    <circle cx="365" cy="63" r="1.5"/><circle cx="493" cy="268" r="2"/>
    <circle cx="706" cy="62" r="2"/><circle cx="817" cy="243" r="1.5"/>
    <circle cx="965" cy="78" r="2"/><circle cx="1080" cy="224" r="1.5"/>
  </g>
  <g fill="none" stroke="#a78bfa" stroke-opacity=".65">
