<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Abstract purple and blue energy</title>
  <desc id="desc">Original dark banner with glowing violet and blue ribbons, sparks, and geometric accents.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080b14"/>
      <stop offset=".52" stop-color="#111326"/>
      <stop offset="1" stop-color="#080b14"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset=".48" stop-color="#8b5cf6" stop-opacity=".85"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#7c3aed" stop-opacity=".45"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-glow" x="-50%" y="-100%" width="200%" height="300%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>
  <rect width="1200" height="320" rx="18" fill="url(#background)"/>
  <ellipse cx="600" cy="155" rx="490" ry="180" fill="url(#glow)"/>
